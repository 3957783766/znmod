<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉化资源包 · 下载中心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .download-center {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 
                0 20px 40px -12px rgba(0, 20, 30, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.7);
            padding: 2rem 2rem 2.5rem;
            transition: box-shadow 0.3s ease;
        }

        .download-center:hover {
            box-shadow: 0 24px 48px -12px rgba(0, 30, 40, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b2b3b;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 0.25rem;
            padding-left: 0.25rem;
        }

        h1::before {
            content: "🎨";
            font-size: 2.2rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        .subhead {
            font-size: 0.95rem;
            color: #3f5e6f;
            margin-bottom: 2rem;
            font-weight: 400;
            border-left: 4px solid #2c9f8f;
            padding: 0.5rem 1.5rem 0.5rem 1rem;
            background: rgba(44, 159, 143, 0.06);
            border-radius: 0 8px 8px 0;
            width: fit-content;
        }

        .search-section {
            margin-bottom: 2.5rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 4rem;
            padding: 0.3rem 0.3rem 0.3rem 1.5rem;
            box-shadow: 0 8px 20px -8px rgba(0, 40, 50, 0.15), 
                        0 0 0 1px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(44, 159, 143, 0.2);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            border-color: #2c9f8f;
            box-shadow: 0 8px 24px -6px rgba(44, 159, 143, 0.25), 
                        0 0 0 2px rgba(44, 159, 143, 0.2);
        }

        .search-icon {
            font-size: 1.3rem;
            opacity: 0.6;
            margin-right: 0.75rem;
        }

        #searchInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.1rem;
            padding: 0.85rem 0.25rem;
            background: transparent;
            color: #0b2b3b;
            font-weight: 400;
        }

        #searchInput::placeholder {
            color: #7f9aa8;
            font-weight: 300;
        }

        .search-hint {
            background: #2c9f8f;
            color: white;
            border-radius: 3rem;
            padding: 0.7rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 6px 12px -4px rgba(44, 159, 143, 0.4);
            white-space: nowrap;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0 0.5rem;
            color: #2c4b5a;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .file-count {
            background: rgba(44, 159, 143, 0.12);
            padding: 0.35rem 1rem;
            border-radius: 30px;
            color: #1c6b5e;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .refresh-note {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #4b6c7c;
        }

        .mod-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            max-height: 460px;
            overflow-y: auto;
            padding-right: 0.35rem;
            scrollbar-width: thin;
            scrollbar-color: #b6d3cf #e9f1f2;
        }

        .mod-list::-webkit-scrollbar {
            width: 6px;
        }

        .mod-list::-webkit-scrollbar-track {
            background: #e9f1f2;
            border-radius: 10px;
        }

        .mod-list::-webkit-scrollbar-thumb {
            background: #b6d3cf;
            border-radius: 10px;
        }

        .mod-item {
            background: white;
            border-radius: 1.5rem;
            padding: 1rem 1.5rem 1rem 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 4px 12px -6px rgba(0, 30, 30, 0.08);
            border: 1px solid rgba(44, 159, 143, 0.1);
            transition: all 0.2s ease;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mod-item:hover {
            border-color: rgba(44, 159, 143, 0.35);
            box-shadow: 0 10px 20px -10px rgba(44, 159, 143, 0.2);
            transform: scale(1.005);
        }

        .mod-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 0;
        }

        .file-icon {
            font-size: 1.7rem;
            width: 3rem;
            height: 3rem;
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7);
            flex-shrink: 0;
            background: linear-gradient(135deg, #fce9c9, #f5d5a0);
        }

        .file-details {
            flex: 1;
            min-width: 0;
        }

        /* ============================================================
           方案 D：两行折行 + 悬停显示完整名字
           ============================================================ */
        .file-name {
            font-weight: 600;
            color: #0d3440;
            font-size: 1.05rem;
            margin-bottom: 0.25rem;
            word-break: break-all;           /* 长英文/数字/中文都强制换行 */
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;            /* 最多显示 2 行，超出省略 */
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: help;                     /* 悬停显示完整名字 */
        }

        .file-meta {
            font-size: 0.75rem;
            color: #5a7b8a;
            display: flex;
            gap: 1rem;
            font-weight: 400;
        }

        .file-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .download-btn {
            background: #0d2e3b;
            border: none;
            border-radius: 3rem;
            padding: 0.6rem 1.6rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
            box-shadow: 0 6px 14px -6px rgba(0, 40, 50, 0.35);
            transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .download-btn:hover {
            background: #174b5e;
            box-shadow: 0 8px 18px -6px #0d2e3b80;
        }

        .download-btn:active {
            transform: scale(0.96);
            background: #0b2530;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 2rem;
            color: #4f6f7e;
            border: 1px dashed rgba(44, 159, 143, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .empty-state .big-icon {
            font-size: 3rem;
            opacity: 0.5;
            margin-bottom: 0.25rem;
        }

        .loading-state {
            text-align: center;
            padding: 2.5rem;
            color: #2c6b5e;
            font-weight: 500;
            background: #f0f7f6;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .spinner {
            width: 1.4rem;
            height: 1.4rem;
            border: 3px solid rgba(44, 159, 143, 0.25);
            border-top-color: #2c9f8f;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .no-result {
            text-align: center;
            padding: 2.5rem;
            background: white;
            border-radius: 2rem;
            color: #5b7e8c;
            border: 1px solid #cfe3e0;
        }

        footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.75rem;
            color: #8ba7b3;
            border-top: 1px solid rgba(44, 159, 143, 0.15);
            padding-top: 1.2rem;
        }

        .highlight {
            background: #2c9f8f20;
            border-radius: 4px;
            padding: 0 2px;
            font-weight: 600;
            color: #1a6b5e;
        }
    </style>
</head>
<body>
<div class="download-center">
    <h1>汉化资源包</h1>
    <div class="subhead">自动检测同目录下的 .zip 资源包</div>

    <div class="search-section">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索资源包名称或关键字..." autocomplete="off">
            <div class="search-hint">实时过滤</div>
        </div>
    </div>

    <div class="stats-bar">
        <div class="file-count" id="fileCount">检测中...</div>
        <div class="refresh-note">
            <span>📂</span> 同目录 .zip 资源包
        </div>
    </div>

    <div id="modListContainer" class="mod-list">
        <div class="loading-state">
            <div class="spinner"></div>
            正在扫描资源包...
        </div>
    </div>

    <footer>
        ⚡ 点击下载即保存资源包 · 文件来源于当前目录
    </footer>
</div>

<script>
    (function() {
        // 只识别 .zip 资源包
        const ALLOWED_EXTS = ['.zip'];

        let allFiles = [];
        let filteredFiles = [];
        let currentSearchTerm = '';

        const searchInput = document.getElementById('searchInput');
        const modListContainer = document.getElementById('modListContainer');
        const fileCountSpan = document.getElementById('fileCount');

        // ---------- 工具 ----------
        function getExt(name) {
            const idx = name.lastIndexOf('.');
            return idx >= 0 ? name.slice(idx).toLowerCase() : '';
        }

        function isAllowed(name) {
            return ALLOWED_EXTS.includes(getExt(name));
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function highlightText(text, searchTerm) {
            if (!searchTerm) return escapeHtml(text);
            const escapedText = escapeHtml(text);
            const escapedTerm = escapeHtml(searchTerm).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedTerm})`, 'gi');
            return escapedText.replace(regex, '<span class="highlight">$1</span>');
        }

        function formatDateTime(date) {
            if (!date) return '未知时间';
            try {
                const d = new Date(date);
                if (isNaN(d.getTime())) return '未知时间';
                return d.toLocaleString('zh-CN', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch {
                return '未知时间';
            }
        }

        // ---------- 渲染 ----------
        function renderModList() {
            if (!filteredFiles.length) {
                if (currentSearchTerm.trim() !== '') {
                    modListContainer.innerHTML = `
                        <div class="no-result">
                            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🔎</div>
                            <div style="font-weight:500; font-size:1.1rem;">没有找到匹配 “${escapeHtml(currentSearchTerm)}” 的资源包</div>
                            <div style="font-size:0.9rem; margin-top:0.5rem; color:#7b98a6;">试试其他关键字或清空搜索</div>
                        </div>
                    `;
                } else {
                    modListContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="big-icon">📭</div>
                            <div style="font-weight:500; font-size:1.1rem;">未检测到资源包</div>
                            <div style="font-size:0.9rem;">请确保同目录下存在 .zip 文件</div>
                        </div>
                    `;
                }
                return;
            }

            let html = '';
            filteredFiles.forEach(file => {
                const highlightedName = highlightText(file.name, currentSearchTerm);
                const sizeFormatted = formatFileSize(file.size || 0);
                const modified = formatDateTime(file.lastModified);

                // ⭐ 加了 title 属性，悬停显示完整名字
                html += `
                    <div class="mod-item">
                        <div class="mod-info">
                            <div class="file-icon">🗜️</div>
                            <div class="file-details">
                                <div class="file-name" title="${escapeHtml(file.name)}">${highlightedName}</div>
                                <div class="file-meta">
                                    <span>📄 ${sizeFormatted}</span>
                                    <span>🕒 ${modified}</span>
                                </div>
                            </div>
                        </div>
                        <button class="download-btn" data-file-name="${escapeHtml(file.name)}">
                            <span>⬇️</span> 下载
                        </button>
                    </div>
                `;
            });
            modListContainer.innerHTML = html;

            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    downloadFile(btn.getAttribute('data-file-name'));
                });
            });
        }

        // ---------- 下载 ----------
        function downloadFile(fileName) {
            const a = document.createElement('a');
            a.href = encodeURI(fileName);
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            const btns = document.querySelectorAll(`.download-btn[data-file-name="${CSS.escape(fileName)}"]`);
            btns.forEach(btn => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<span>✅</span> 下载中';
                btn.disabled = true;
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }, 1500);
            });
        }

        // ---------- 过滤 ----------
        function applyFilter() {
            const term = currentSearchTerm.trim().toLowerCase();
            filteredFiles = term
                ? allFiles.filter(f => f.name.toLowerCase().includes(term))
                : [...allFiles];

            filteredFiles.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
            renderModList();
            fileCountSpan.textContent = `📁 共 ${filteredFiles.length} 个资源包`;
        }

        // ---------- 加载数据 ----------
        async function loadFiles() {
            try {
                const res = await fetch('files.json?_=' + Date.now());
                if (!res.ok) throw new Error('files.json 不存在');
                const data = await res.json();
                allFiles = data.filter(f => f.name && isAllowed(f.name));
                filteredFiles = [...allFiles];
                applyFilter();
            } catch (err) {
                console.warn('加载资源包列表失败:', err.message);
                allFiles = [];
                filteredFiles = [];
                fileCountSpan.textContent = '📁 0 个资源包';
                modListContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="big-icon">📭</div>
                        <div style="font-weight:500; font-size:1.1rem;">未检测到资源包</div>
                        <div style="font-size:0.9rem;">请确保同目录下存在 .zip 文件，并且 files.json 已生成</div>
                    </div>
                `;
            }
        }

        // ---------- 事件 ----------
        searchInput.addEventListener('input', (e) => {
            currentSearchTerm = e.target.value;
            applyFilter();
        });

        window.addEventListener('DOMContentLoaded', loadFiles);
    })();
</script>
</body>
</html>
